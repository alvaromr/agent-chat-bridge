# The unit tests and the system's smoke (`pnpm smoke-os`) on Windows and Linux, the systems no one runs them on by hand
# (docs/decisions/windows-linux-untested.md). The full gate, `pnpm check`, runs on macOS before every commit
# (.githooks/pre-commit); lint, types and the secret scan read the same files on every system, so they don't run here.
# Each action is pinned to the commit of its release.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm of package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm smoke-os
